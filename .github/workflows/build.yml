name: Build MOKO PS1
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends cmake ninja-build curl unzip

      - name: Install prebuilt PSn00bSDK
        run: |
          mkdir -p /tmp/psn00b-release /opt/psn00bsdk
          curl -fL --retry 4 --retry-delay 3 \
            https://github.com/Lameguy64/PSn00bSDK/releases/download/v0.24/PSn00bSDK-0.24-Linux.zip \
            -o /tmp/psn00bsdk.zip
          unzip -q /tmp/psn00bsdk.zip -d /tmp/psn00b-release
          SDK_DIR=$(find /tmp/psn00b-release -maxdepth 1 -type d -name 'PSn00bSDK-*-Linux' | head -1)
          test -n "$SDK_DIR"
          cp -a "$SDK_DIR"/. /opt/psn00bsdk/
          echo "/opt/psn00bsdk/bin" >> "$GITHUB_PATH"
          echo "PSN00BSDK_LIBS=/opt/psn00bsdk/lib/libpsn00b" >> "$GITHUB_ENV"
          /opt/psn00bsdk/bin/mipsel-none-elf-gcc --version
          /opt/psn00bsdk/bin/mkpsxiso --help >/dev/null || true

      - name: Configure MOKO
        run: cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$PSN00BSDK_LIBS/cmake/sdk.cmake" -DCMAKE_BUILD_TYPE=Release

      - name: Build MOKO BIN/CUE
        run: cmake --build build

      - name: Verify cinematic and gameplay revisions are compiled
        run: |
          EXE=build/moko
          test -f "$EXE" || EXE=build/moko.exe
          grep -a -q 'WORLD FX REV 270' "$EXE" || { echo 'Runtime world FX revision missing'; exit 1; }
          grep -a -q 'CINEMA REV 269' "$EXE" || { echo 'Cinematic revision marker missing'; exit 1; }
          grep -a -q 'CHAPTER I - THE LAST TRAIN' "$EXE" || { echo 'Station chapter card missing'; exit 1; }
          grep -a -q 'FINAL CHAPTER - THE LOST HOUR' "$EXE" || { echo 'Clock Chamber chapter card missing'; exit 1; }
          grep -a -q 'THE HOUR WARDEN AWAKENS' "$EXE" || { echo 'Hour Warden intro missing'; exit 1; }
          grep -a -q 'SURVIVE ALL THREE PHASES' "$EXE" || { echo 'Boss onboarding missing'; exit 1; }
          grep -a -q 'TITLE REV 268' "$EXE" || { echo 'Title revision marker missing'; exit 1; }
          grep -a -q 'MEMORY LESSON 1/4' "$EXE" || { echo 'Movement onboarding missing'; exit 1; }
          grep -a -q 'MEMORY LESSON 4/4' "$EXE" || { echo 'Clock Guard onboarding missing'; exit 1; }
          grep -a -q 'UP/DOWN SELECT  CROSS CONFIRM' "$EXE" || { echo 'Title menu controls missing'; exit 1; }
          grep -a -q 'PAUSE REV 267' "$EXE" || { echo 'Pause revision marker missing'; exit 1; }
          grep -a -q 'MEMORY MAP' "$EXE" || { echo 'Pause memory map missing'; exit 1; }
          grep -a -q 'Clock Guard slows time drain' "$EXE" || { echo 'Pause controls help missing'; exit 1; }
          grep -a -q 'COMPASS REV 265' "$EXE" || { echo 'Objective compass revision marker missing'; exit 1; }
          grep -a -q 'OBJECTIVE: RESTORE THE STATION SIGNAL' "$EXE" || { echo 'Station objective missing'; exit 1; }
          grep -a -q 'OBJECTIVE: CLAIM THE MEMORY SHARD' "$EXE" || { echo 'Shard objective missing'; exit 1; }
          grep -a -q 'COMPASS: %s  DIST %d' "$EXE" || { echo 'Dynamic compass feedback missing'; exit 1; }
          grep -a -q "LAST TRAIN: CONDUCTOR'S WATCH RECOVERED" "$EXE" || { echo 'Last Train setpiece regressed'; exit 1; }
          grep -a -q 'TIME FRAGMENT +5 SEC' "$EXE" || { echo 'Temporal pickups regressed'; exit 1; }
          grep -a -q 'CROSS - REWIND TO CHECKPOINT' "$EXE" || { echo 'Checkpoint retry regressed'; exit 1; }
          grep -a -q 'HOUR WARDEN PHASE' "$EXE" || { echo 'Hour Warden phase HUD regressed'; exit 1; }
          grep -a -q 'MINIBOSS: CHRONO SENTINEL' "$EXE" || { echo 'Chrono Sentinel regressed'; exit 1; }
          grep -a -q 'REST AT MEMORY CLOCK' "$EXE" || { echo 'Memory Clock regressed'; exit 1; }
          grep -a -q 'SQUARE:GUARD' "$EXE" || { echo 'Clock Guard regressed'; exit 1; }
          grep -a -q 'TRIANGLE - CONTINUE' "$EXE" || { echo 'Continue menu missing'; exit 1; }

      - name: Collect and fingerprint disc image
        run: |
          mkdir -p dist
          BIN=$(find build -type f -iname 'MOKO.bin' | head -1)
          CUE=$(find build -type f -iname 'MOKO.cue' | head -1)
          test -n "$BIN" && test -n "$CUE"
          cp "$BIN" dist/MOKO.bin
          cp "$CUE" dist/MOKO.cue
          BIN_SHA=$(sha256sum dist/MOKO.bin | awk '{print $1}')
          BIN_SIZE=$(stat -c%s dist/MOKO.bin)
          CUE_SHA=$(sha256sum dist/MOKO.cue | awk '{print $1}')
          printf 'MOKO runtime world FX revision 270\ncommit=%s\nrun=%s\nbin_sha256=%s\nbin_bytes=%s\ncue_sha256=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$BIN_SHA" "$BIN_SIZE" "$CUE_SHA" > dist/BUILD.txt
          cat dist/BUILD.txt
          ls -lh dist/MOKO.bin dist/MOKO.cue dist/BUILD.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MOKO-PS1-worldfx270-run${{ github.run_number }}
          path: dist/
          if-no-files-found: error
