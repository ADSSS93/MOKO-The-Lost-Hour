name: Build MOKO PS1
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends cmake ninja-build curl unzip

      - name: Install prebuilt PSn00bSDK
        run: |
          mkdir -p /tmp/psn00b-release /opt/psn00bsdk
          curl -fL --retry 4 --retry-delay 3 \
            https://github.com/Lameguy64/PSn00bSDK/releases/download/v0.24/PSn00bSDK-0.24-Linux.zip \
            -o /tmp/psn00bsdk.zip
          unzip -q /tmp/psn00bsdk.zip -d /tmp/psn00b-release
          SDK_DIR=$(find /tmp/psn00b-release -maxdepth 1 -type d -name 'PSn00bSDK-*-Linux' | head -1)
          test -n "$SDK_DIR"
          cp -a "$SDK_DIR"/. /opt/psn00bsdk/
          echo "/opt/psn00bsdk/bin" >> "$GITHUB_PATH"
          echo "PSN00BSDK_LIBS=/opt/psn00bsdk/lib/libpsn00b" >> "$GITHUB_ENV"
          /opt/psn00bsdk/bin/mipsel-none-elf-gcc --version
          /opt/psn00bsdk/bin/mkpsxiso --help >/dev/null || true

      - name: Configure MOKO
        run: cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$PSN00BSDK_LIBS/cmake/sdk.cmake" -DCMAKE_BUILD_TYPE=Release

      - name: Build MOKO BIN/CUE
        run: cmake --build build

      - name: Verify guard revision is compiled
        run: |
          EXE=build/moko
          test -f "$EXE" || EXE=build/moko.exe
          grep -a -q 'GUARD REV 257' "$EXE" || { echo 'Guard revision marker missing'; exit 1; }
          grep -a -q 'SQUARE:GUARD' "$EXE" || { echo 'Clock Guard controls missing'; exit 1; }
          grep -a -q 'CLOCK GUARD' "$EXE" || { echo 'Clock Guard HUD status missing'; exit 1; }
          grep -a -q 'AREA SECURED - TIME MEMORY RESTORED' "$EXE" || { echo 'Encounter feedback regressed'; exit 1; }
          grep -a -q 'TRIANGLE - CONTINUE' "$EXE" || { echo 'Continue menu missing'; exit 1; }

      - name: Collect disc image
        run: |
          mkdir -p dist
          BIN=$(find build -type f -iname 'MOKO.bin' | head -1)
          CUE=$(find build -type f -iname 'MOKO.cue' | head -1)
          test -n "$BIN" && test -n "$CUE"
          cp "$BIN" dist/MOKO.bin
          cp "$CUE" dist/MOKO.cue
          printf 'MOKO guard revision 257\ncommit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" > dist/BUILD.txt
          ls -lh dist/MOKO.bin dist/MOKO.cue dist/BUILD.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MOKO-PS1-guard257-run${{ github.run_number }}
          path: dist/
          if-no-files-found: error
