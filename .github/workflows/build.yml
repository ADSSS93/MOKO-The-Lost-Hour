name: Build MOKO PS1
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends cmake ninja-build curl unzip

      - name: Install prebuilt PSn00bSDK
        run: |
          mkdir -p /tmp/psn00b-release /opt/psn00bsdk
          curl -fL --retry 4 --retry-delay 3 \
            https://github.com/Lameguy64/PSn00bSDK/releases/download/v0.24/PSn00bSDK-0.24-Linux.zip \
            -o /tmp/psn00bsdk.zip
          unzip -q /tmp/psn00b-release /tmp/psn00bsdk.zip 2>/dev/null || unzip -q /tmp/psn00bsdk.zip -d /tmp/psn00b-release
          SDK_DIR=$(find /tmp/psn00b-release -maxdepth 1 -type d -name 'PSn00bSDK-*-Linux' | head -1)
          test -n "$SDK_DIR"
          cp -a "$SDK_DIR"/. /opt/psn00bsdk/
          echo "/opt/psn00bsdk/bin" >> "$GITHUB_PATH"
          echo "PSN00BSDK_LIBS=/opt/psn00bsdk/lib/libpsn00b" >> "$GITHUB_ENV"
          /opt/psn00bsdk/bin/mipsel-none-elf-gcc --version

      - name: Configure MOKO
        run: cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$PSN00BSDK_LIBS/cmake/sdk.cmake" -DCMAKE_BUILD_TYPE=Release

      - name: Build MOKO BIN/CUE
        run: cmake --build build

      - name: Verify clean vertical slice architecture
        run: |
          EXE=build/moko
          test -f "$EXE" || EXE=build/moko.exe
          test -f "$EXE"
          test -f build/generated/moko_generated.h
          test -f build/generated/village_model.h
          test -f build/generated/clockmaker_model.h
          test -f build/generated/boar_model.h
          grep -q 'MOKO_FACES' build/generated/moko_generated.h
          grep -q 'VILLAGE_FACES' build/generated/village_model.h
          grep -q 'CLOCKMAKER_FACES' build/generated/clockmaker_model.h
          grep -q 'BOAR_FACES' build/generated/boar_model.h
          grep -q 'src/clean_vertical_slice.c' CMakeLists.txt
          grep -q 'obj_to_header.py' CMakeLists.txt
          ! grep -q 'inject_station_visuals.py' CMakeLists.txt
          ! grep -q 'build_world3d_slice_v3.py' CMakeLists.txt
          grep -q 'draw_mesh(village_v' src/clean_vertical_slice.c
          grep -q 'draw_mesh(moko_v' src/clean_vertical_slice.c
          grep -q 'TIME SPLINTERS' src/clean_vertical_slice.c
          grep -q 'SHADOW BOAR' src/clean_vertical_slice.c
          grep -q 'AREA CLEAR' src/clean_vertical_slice.c
          grep -q 'gte_SetRotMatrix' src/clean_vertical_slice.c
          grep -q 'gte_SetTransMatrix' src/clean_vertical_slice.c
          grep -q '^v ' assets/models/moko_lowpoly.obj
          grep -q '^v ' assets/models/village_dawn_slice.obj
          grep -q '^v ' assets/models/clockmaker.obj
          grep -q '^v ' assets/models/shadow_boar.obj
          echo 'Clean OBJ -> generated mesh -> PS1 runtime pipeline verified.'

      - name: Collect and fingerprint disc image
        run: |
          mkdir -p dist
          BIN=$(find build -type f -iname 'MOKO.bin' | head -1)
          CUE=$(find build -type f -iname 'MOKO.cue' | head -1)
          test -n "$BIN" && test -n "$CUE"
          cp "$BIN" dist/MOKO.bin
          cp "$CUE" dist/MOKO.cue
          BIN_SHA=$(sha256sum dist/MOKO.bin | awk '{print $1}')
          BIN_SIZE=$(stat -c%s dist/MOKO.bin)
          CUE_SHA=$(sha256sum dist/MOKO.cue | awk '{print $1}')
          printf 'MOKO clean vertical slice\ncommit=%s\nrun=%s\nbin_sha256=%s\nbin_bytes=%s\ncue_sha256=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$BIN_SHA" "$BIN_SIZE" "$CUE_SHA" > dist/BUILD.txt
          cat dist/BUILD.txt
          ls -lh dist/MOKO.bin dist/MOKO.cue dist/BUILD.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MOKO-PS1-clean-slice-run${{ github.run_number }}
          path: dist/
          if-no-files-found: error
