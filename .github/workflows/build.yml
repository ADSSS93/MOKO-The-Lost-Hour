name: Build MOKO PS1
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends cmake ninja-build curl unzip

      - name: Install prebuilt PSn00bSDK
        run: |
          mkdir -p /tmp/psn00b-release /opt/psn00bsdk
          curl -fL --retry 4 --retry-delay 3 \
            https://github.com/Lameguy64/PSn00bSDK/releases/download/v0.24/PSn00bSDK-0.24-Linux.zip \
            -o /tmp/psn00bsdk.zip
          unzip -q /tmp/psn00b-release /tmp/psn00bsdk.zip 2>/dev/null || unzip -q /tmp/psn00bsdk.zip -d /tmp/psn00b-release
          SDK_DIR=$(find /tmp/psn00b-release -maxdepth 1 -type d -name 'PSn00bSDK-*-Linux' | head -1)
          test -n "$SDK_DIR"
          cp -a "$SDK_DIR"/. /opt/psn00bsdk/
          echo "/opt/psn00bsdk/bin" >> "$GITHUB_PATH"
          echo "PSN00BSDK_LIBS=/opt/psn00bsdk/lib/libpsn00b" >> "$GITHUB_ENV"
          /opt/psn00bsdk/bin/mipsel-none-elf-gcc --version
          /opt/psn00bsdk/bin/mkpsxiso --help >/dev/null || true

      - name: Configure MOKO
        run: cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$PSN00BSDK_LIBS/cmake/sdk.cmake" -DCMAKE_BUILD_TYPE=Release

      - name: Build MOKO BIN/CUE
        run: cmake --build build

      - name: Verify authored level and gameplay revisions are compiled
        run: |
          EXE=build/moko
          test -f "$EXE" || EXE=build/moko.exe
          test -f build/generated/main_visual.c || { echo 'Generated gameplay source missing'; exit 1; }
          grep -q 'VILLAGE PRESENTATION REV 289' src/world3d.c || { echo 'Village presentation revision missing'; exit 1; }
          grep -q 'SVECTOR rot={155,0,0,0}' src/world3d.c || { echo 'Cinematic camera pitch missing'; exit 1; }
          grep -q 'clock_tower' src/world3d.c || { echo 'Village landmark missing'; exit 1; }
          grep -q 'static void lamp' src/world3d.c || { echo 'Village authored lighting props missing'; exit 1; }
          grep -q 'int step=(phase==1?7:(phase==3?-7:0))' src/world3d.c || { echo 'Articulated Moko gait missing'; exit 1; }
          grep -q 'REAL 3D VERTICAL SLICE REV 288' build/generated/main_visual.c || { echo '3D depth/jump slice missing'; exit 1; }
          grep -q 'world3d_draw_village(px,py,moko_z/16' build/generated/main_visual.c || { echo '3D jump state not wired'; exit 1; }
          grep -q 'ONE MINUTE SLICE REV 288' build/generated/main_visual.c || { echo 'Village mission revision missing'; exit 1; }
          grep -q 'VILLAGER AHEAD   CROSS: TALK' build/generated/main_visual.c || { echo 'Village NPC mission step missing'; exit 1; }
          grep -q 'static int wz(int sy)' src/world3d.c || { echo 'Ground-plane depth mapping missing'; exit 1; }
          grep -q 'COMMERCIAL VISUAL REV 283' build/generated/main_visual.c || { echo 'Commercial visual revision missing'; exit 1; }
          grep -q 'D-PAD  MOVE' build/generated/main_visual.c || { echo 'Compact movement onboarding missing'; exit 1; }
          grep -q 'MOKO VISUAL REV 284' src/moko_sprite.c || { echo 'Moko renderer visual revision missing'; exit 1; }
          grep -q 'MOKO VISUAL REV 284' tools/generate_moko_tim.py || { echo 'Moko TIM generator revision missing'; exit 1; }
          grep -q 'gte_SetGeomOffset' src/world3d.c || { echo '3D GTE renderer missing'; exit 1; }
          grep -q 'world3d_draw_station' src/world3d.c || { echo '3D station renderer missing'; exit 1; }
          grep -a -q 'MOKO COMBAT FEEDBACK REV 281' "$EXE" || { echo 'Moko combat feedback revision missing'; exit 1; }
          grep -a -q 'HOUR CHAMBER POLISH REV 280' "$EXE" || { echo 'Hour Chamber polish revision missing'; exit 1; }
          grep -q 'TIME ANCHORS %d/3  STABILITY %d%%' build/generated/main_visual.c || { echo 'Hour Chamber anchor HUD missing'; exit 1; }
          grep -q 'finale.phase_timer+=90' build/generated/main_visual.c || { echo 'Hour Chamber anchor gameplay missing'; exit 1; }
          grep -a -q 'CLOCKWORKS EXPANSION REV 279' "$EXE" || { echo 'Clockworks expansion revision missing'; exit 1; }
          grep -q 'CHRONO RELAYS %d/3  SENTINEL %s' build/generated/main_visual.c || { echo 'Clockworks objective HUD missing'; exit 1; }
          grep -q 'shard_taken\[3\]&&clock_relays==3' build/generated/main_visual.c || { echo 'Clockworks progression gate missing'; exit 1; }
          grep -a -q 'FORGOTTEN HOUSE REV 278' "$EXE" || { echo 'Forgotten House revision missing'; exit 1; }
          grep -q 'MEMORY LIGHTS %d/3  HOUND %s' build/generated/main_visual.c || { echo 'Forgotten House mission HUD injection missing'; exit 1; }
          grep -q 'house_lights==3&&house_hound_defeated' build/generated/main_visual.c || { echo 'Forgotten House progression gate missing'; exit 1; }
          grep -a -q 'BACKWARD STREET REV 277' "$EXE" || { echo 'Backward Street revision missing'; exit 1; }
          grep -a -q 'STATION LEVEL REV 276' "$EXE" || { echo 'Silent Station traversal revision missing'; exit 1; }
          grep -a -q 'CAMERA REV 275' "$EXE" || { echo 'Scrolling camera revision missing'; exit 1; }
          grep -a -q 'PLATFORM REV 274' "$EXE" || { echo 'Raised platform traversal revision missing'; exit 1; }
          grep -a -q 'FEEL REV 272' "$EXE" || { echo 'Inertial movement revision missing'; exit 1; }
          grep -a -q 'WORLD FX REV 270' "$EXE" || { echo 'Runtime world FX revision missing'; exit 1; }
          grep -a -q 'CINEMA REV 269' "$EXE" || { echo 'Cinematic revision marker missing'; exit 1; }
          grep -a -q 'CHAPTER I - THE LAST TRAIN' "$EXE" || { echo 'Station chapter card missing'; exit 1; }
          grep -a -q 'THE HOUR WARDEN AWAKENS' "$EXE" || { echo 'Hour Warden intro missing'; exit 1; }
          grep -a -q 'TITLE REV 268' "$EXE" || { echo 'Title revision marker missing'; exit 1; }
          grep -a -q 'PAUSE REV 267' "$EXE" || { echo 'Pause revision marker missing'; exit 1; }
          grep -a -q 'COMPASS REV 265' "$EXE" || { echo 'Objective compass revision marker missing'; exit 1; }
          grep -a -q 'CROSS - REWIND TO CHECKPOINT' "$EXE" || { echo 'Checkpoint retry regressed'; exit 1; }
          grep -q 'warden_phase_level' build/generated/main_visual.c || { echo 'Hour Warden phase logic regressed'; exit 1; }
          grep -q 'sentinel_active' build/generated/main_visual.c || { echo 'Chrono Sentinel logic regressed'; exit 1; }
          grep -q 'clock_guard_art' build/generated/main_visual.c || { echo 'Clock Guard gameplay regressed'; exit 1; }
          grep -q 'memory_clock_near' build/generated/main_visual.c || { echo 'Memory Clock logic regressed'; exit 1; }
          grep -a -q 'TRIANGLE - CONTINUE' "$EXE" || { echo 'Continue menu missing'; exit 1; }

      - name: Collect and fingerprint disc image
        run: |
          mkdir -p dist
          BIN=$(find build -type f -iname 'MOKO.bin' | head -1)
          CUE=$(find build -type f -iname 'MOKO.cue' | head -1)
          test -n "$BIN" && test -n "$CUE"
          cp "$BIN" dist/MOKO.bin
          cp "$CUE" dist/MOKO.cue
          BIN_SHA=$(sha256sum dist/MOKO.bin | awk '{print $1}')
          BIN_SIZE=$(stat -c%s dist/MOKO.bin)
          CUE_SHA=$(sha256sum dist/MOKO.cue | awk '{print $1}')
          printf 'MOKO Village presentation rev 289\ncommit=%s\nrun=%s\nbin_sha256=%s\nbin_bytes=%s\ncue_sha256=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$BIN_SHA" "$BIN_SIZE" "$CUE_SHA" > dist/BUILD.txt
          cat dist/BUILD.txt
          ls -lh dist/MOKO.bin dist/MOKO.cue dist/BUILD.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MOKO-PS1-3d-rev289-run${{ github.run_number }}
          path: dist/
          if-no-files-found: error
